controller_manager:
  ros__parameters:

    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: position_controllers/GripperActionController


arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
    command_interfaces:
      - position  
    state_interfaces:
      - position
      - velocity

    interface_name: position

gripper_controller:
  ros__parameters:
    joint: "joint5a1"
    allow_stalling: false
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
    goal_tolerance: 0.01
    max_effort: 0.0

/**:
  ros__parameters:
    mujoco_plugins:
      mujoco_camera_plugin:
        type: "mujoco_ros2_control_plugins/CameraPlugin"
        camera_publish_rate: 6.0
        front_camera:
          policy: streaming
          frame_name: front_camera_optical_frame
          info_topic: /front_camera/color/camera_info
          image_topic: /front_camera/color/image_raw
          depth_topic: /front_camera/aligned_depth_to_color/image_raw